[package]
name = "groundwork-habits"
version = "1.7.3"
description = "Groundwork Habits: the desktop shell (Tauri) around the web app in ../www, for the full app and Lite"
license = "AGPL-3.0-or-later"
edition = "2021"
publish = false

[[bin]]
# renamed to "<productName>.exe" by tools/build_tauri_win.js (no spaces allowed here)
name = "groundwork-habits"
path = "src/main.rs"

[features]
# the full app: data folder, calendar feed, updates, and moving data over from the Electron app.
# Lite is built without it, so it contains no network code at all
full = ["dep:reqwest", "dep:sha2", "dep:rfd", "dep:rusty-leveldb", "dep:tokio", "dep:url"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: serve the embedded www/ (what the Tauri CLI turns on for release builds; we build with plain cargo)
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
sha2 = { version = "0.10", optional = true }
rfd = { version = "0.15", optional = true }
rusty-leveldb = { version = "3", optional = true }
tokio = { version = "1", optional = true, features = ["net", "time"] }
url = { version = "2", optional = true }

[profile.release]
# small exe: these are the settings Tauri recommends for size
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
