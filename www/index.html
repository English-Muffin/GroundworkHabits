<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits | Groundwork Habits</title>
<meta name="theme-color" content="#080808">
<!-- Content Security Policy: the app's own scripts only, and network only to itself, Dropbox, Google and the desktop bridge. Inline style attributes stay allowed (the templates use them) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.dropboxapi.com https://content.dropboxapi.com https://www.googleapis.com https://oauth2.googleapis.com http://gw.localhost gw://localhost http://ipc.localhost ipc://localhost; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groundwork">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="js/early.js"></script>
<div class="app">
  <header class="top">
    <div class="ttl" id="ttl">Habits</div>
    <nav class="pnav" id="nav" aria-label="Main"></nav>
    <div class="tact"><button class="gear" data-act="syncgo" aria-label="Synced" id="syncBtn" hidden></button><button class="gear" data-act="search" aria-label="Search" id="searchBtn"></button><button class="gear" data-act="gear" aria-label="Settings" id="gearBtn"></button></div>
    <div class="menu" id="menu" hidden></div>
  </header>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden role="status"></div>
<div id="lock" hidden></div>
<div id="focusbar" class="focusbar" hidden role="timer" aria-live="off"></div>
<input type="file" id="impFile" accept="application/json,.json" hidden>

<script src="js/start.js"></script>
<!-- the app: classic scripts in this order, sharing one scope (no build step) -->
<script src="js/core.js"></script>
<script src="js/keys.js"></script>
<script src="js/cloud.js"></script>
<script src="js/habits.js"></script>
<script src="js/tasks.js"></script>
<script src="js/goals.js"></script>
<script src="js/settings.js"></script>
<script src="js/render.js"></script>
<script src="js/events.js"></script>
<script src="js/extras.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
