name: Build Windows, macOS and Android apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']   # pushing a tag like v1.0.0 also publishes a GitHub Release with all three downloads

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy: { matrix: { edition: [full, lite] }, fail-fast: false }   # each platform builds the full app and Lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Lite edition
        if: matrix.edition == 'lite'
        run: node tools/edition.js lite
      - name: Turn off testing features (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release_strip.js
      # Windows: both editions on Tauri (tauri/, Windows' own WebView2: about 5 MB instead of 100 MB of Electron)
      - run: npm run dist:win
      # the Tauri app needs the WebView2 runtime (every Windows 10/11 PC has it; the server images may not)
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $k = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv
          if (-not $v) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\wv2.exe"
            Start-Process "$env:RUNNER_TEMP\wv2.exe" -ArgumentList '/silent','/install' -Wait
            $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv
          }
          "WebView2 runtime: $v"
      - name: Check the built app starts
        shell: bash
        run: |
          d=dist/win-unpacked-tauri; [ "${{ matrix.edition }}" = lite ] && d=dist/win-unpacked-lite
          exe="$d/$(node -p "require('./package.json').build.productName").exe"
          node tests/launch_check.js "$exe"
          node tests/launch_check.js "$exe" --disable-gpu
      - name: 'The Tauri app works (bridge, backups, widget, pop-ups, close, data kept; full also data folder, calendar rules, updates)'
        # it drives the app through window.GroundworkTest, which release builds leave out; main runs it on the same code
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: |
          d=dist/win-unpacked-tauri; [ "${{ matrix.edition }}" = lite ] && d=dist/win-unpacked-lite
          pip install playwright && python tests/tauri_app.py "$(pwd -W)/$d/$(node -p "require('./package.json').build.productName").exe"
      - name: Rust tests (public-address rules, versions)
        if: matrix.edition == 'full'
        working-directory: tauri
        run: cargo test --release --features full
      # Code signing (SignPath Foundation, free for open source), release tags only. Stays off until the SIGNPATH_* secrets
      # exist. Two passes so every exe a user runs is signed: 1) the app exe and the uninstaller, 2) the setup built around
      # them. SignPath's artifact configuration for both: .signpath/artifact-configuration.xml
      - name: Is signing set up?
        id: sign
        env: { TOKEN: '${{ secrets.SIGNPATH_API_TOKEN }}' }
        shell: bash
        run: echo "enabled=$([ -n "$TOKEN" ] && [[ "$GITHUB_REF" == refs/tags/v* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: 'Signing, pass 1: collect the app exe and the uninstaller'
        if: steps.sign.outputs.enabled == 'true'
        shell: bash
        run: |
          d=dist/win-unpacked-tauri; [ "${{ matrix.edition }}" = lite ] && d=dist/win-unpacked-lite
          p="$(node -p "require('./package.json').build.productName")"
          mkdir -p sign1 && cp "$d/$p.exe" sign1/ && APP_DIR="$d" UNINST_ONLY="$(pwd -W)/sign1/uninstaller.exe" node tools/build_setup.js
      - uses: actions/upload-artifact@v4
        id: unsigned1
        if: steps.sign.outputs.enabled == 'true'
        with: { name: 'unsigned-app-${{ matrix.edition }}', path: sign1/*.exe }
      - uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1, pinned
        if: steps.sign.outputs.enabled == 'true'
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: GroundworkHabits
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-exe
          github-artifact-id: '${{ steps.unsigned1.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed1
      - name: 'Signing, pass 2: the portable exe and the setup from the signed parts'
        if: steps.sign.outputs.enabled == 'true'
        shell: bash
        run: |
          d=dist/win-unpacked-tauri; [ "${{ matrix.edition }}" = lite ] && d=dist/win-unpacked-lite
          p="$(node -p "require('./package.json').build.productName")"; v="$(node -p "require('./package.json').version")"
          cp "signed1/$p.exe" "$d/$p.exe" && cp "signed1/$p.exe" "dist/${p// /-}-$v-Windows-portable.exe"
          rm -f dist/*-Windows-setup.exe && APP_DIR="$d" UNINST="$(pwd -W)/signed1/uninstaller.exe" node tools/build_setup.js
          mkdir -p sign2 && mv dist/*-Windows-setup.exe sign2/
      - uses: actions/upload-artifact@v4
        id: unsigned2
        if: steps.sign.outputs.enabled == 'true'
        with: { name: 'unsigned-setup-${{ matrix.edition }}', path: sign2/*.exe }
      - uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1, pinned
        if: steps.sign.outputs.enabled == 'true'
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: GroundworkHabits
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-exe
          github-artifact-id: '${{ steps.unsigned2.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: dist
      - name: Check the signatures
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist/*.exe | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { "Not signed: $($bad.Name -join ', ')"; exit 1 }
          Get-ChildItem dist/*.exe | ForEach-Object { "$($_.Name): $((Get-AuthenticodeSignature $_.FullName).SignerCertificate.Subject)" }
      - uses: actions/upload-artifact@v4
        with: { name: 'Groundwork-Habits-Windows-${{ matrix.edition }}', path: dist/*.exe }

  macos:
    runs-on: macos-latest
    strategy: { matrix: { edition: [full, lite] }, fail-fast: false }   # each platform builds the full app and Lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Lite edition
        if: matrix.edition == 'lite'
        run: node tools/edition.js lite
      - name: Turn off testing features (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release_strip.js
      # macOS on Tauri too (Safari's engine, about 10 MB instead of 166): one universal binary for Apple Silicon and Intel
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm run dist:mac
      - name: Check the built app starts (self-test report; the debugging port does not exist in Safari's engine)
        run: |
          p="$(node -p "require('./package.json').build.productName")"
          node tests/launch_check.js "dist/mac-universal/$p.app/Contents/MacOS/$p" --${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with: { name: 'Groundwork-Habits-macOS-${{ matrix.edition }}', path: dist/*.zip }

  android:
    runs-on: ubuntu-latest
    strategy: { matrix: { edition: [full, lite] }, fail-fast: false }   # each platform builds the full app and Lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Lite edition
        if: matrix.edition == 'lite'
        run: node tools/edition.js lite
      - name: Turn off testing features (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release_strip.js
      - run: npx cap add android
      - name: Generate Android icons (optional)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#00000000' --iconBackgroundColorDark '#00000000' --splashBackgroundColor '#080808' --splashBackgroundColorDark '#080808' || true
      - run: npx cap sync android
      - name: Icon without a background
        # plain transparent icons, no adaptive icon: launchers fill an adaptive icon's empty background with a colour
        run: rm -rf android/app/src/main/res/mipmap-anydpi-v26 && cp -r native/android-res/* android/app/src/main/res/
      - name: Apply version and signing settings
        run: |
          echo "apply from: '../../native/release.gradle'" >> android/app/build.gradle
      # signed release APK when the ANDROID_KEYSTORE_* secrets exist, otherwise the debug-signed APK as before
      - name: Build APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GROUNDWORK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GROUNDWORK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            GROUNDWORK_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../app.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../app.apk
          fi
      - run: mkdir out && cp app.apk "out/$(node -p "require('./package.json').build.productName.replace(/ /g,'-')")-$(node -p "require('./package.json').version")-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: 'Groundwork-Habits-Android-${{ matrix.edition }}', path: out/*.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      # only the final builds: the unsigned-* artifacts from code signing share file names with the signed ones
      - uses: actions/download-artifact@v4
        with: { pattern: 'Groundwork-Habits-*', path: files, merge-multiple: true }
      - name: Checksums
        run: cd files && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with: { files: files/*, body_path: notes.md, name: 'Groundwork Habits ${{ github.ref_name }}' }
      # the desktop auto-update needs the setup and its .sha256 on the release; fail loudly if either is missing
      - name: Check the update files are on the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$names"
          setup=$(echo "$names" | grep -E -- '^Groundwork-Habits-[0-9][^ ]*-Windows-setup\.exe$') || { echo "::error::no Windows setup on the release"; exit 1; }
          echo "$names" | grep -qx "$setup.sha256" || { echo "::error::$setup.sha256 missing: auto-update would refuse it"; exit 1; }
