name: Build Windows, macOS and Android apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']   # pushing a tag like v1.0.0 also publishes a GitHub Release with all three downloads

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Turn off testing features (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release_strip.js
      - run: npm run dist:win
      - name: Check the built app starts
        run: node tests/launch_check.js "dist/win-unpacked/Groundwork Habits.exe"
      - uses: actions/upload-artifact@v4
        with: { name: Groundwork-Habits-Windows, path: dist/*.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Turn off testing features (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release_strip.js
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Check the built app starts
        run: node tests/launch_check.js "$(ls -d "dist/mac-universal/Groundwork Habits.app")/Contents/MacOS/Groundwork Habits"
      - uses: actions/upload-artifact@v4
        with: { name: Groundwork-Habits-macOS, path: dist/*.zip }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Turn off testing features (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release_strip.js
      - run: npx cap add android
      - name: Generate Android icons (optional)
        run: npx @capacitor/assets generate --android || true
      - run: npx cap sync android
      - name: Apply version and signing settings
        run: |
          echo "apply from: '../../native/release.gradle'" >> android/app/build.gradle
      # signed release APK when the ANDROID_KEYSTORE_* secrets exist, otherwise the debug-signed APK as before
      - name: Build APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DAYBOOK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DAYBOOK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            DAYBOOK_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../app.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../app.apk
          fi
      - run: mkdir out && cp app.apk "out/Groundwork-Habits-$(node -p "require('./package.json').version")-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: Groundwork-Habits-Android, path: out/*.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Checksums
        run: cd files && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with: { files: files/* }
