name: Build Windows, macOS and Android apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']   # pushing a tag like v1.0.0 also publishes a GitHub Release with all three downloads

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: Daybook-Windows, path: dist/*.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: Daybook-macOS, path: dist/*.zip }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Generate Android icons (optional)
        run: npx @capacitor/assets generate --android || true
      - run: npx cap sync android
      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android
      - run: mkdir out && cp android/app/build/outputs/apk/debug/app-debug.apk "out/Daybook-$(node -p "require('./package.json').version")-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: Daybook-Android, path: out/*.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: files/* }
